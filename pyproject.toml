[project]
name = "hyperswitch-guard-mcp"
version = "0.1.0"
description = "Agent-safe MCP server for Hyperswitch: policy-checked refunds, PII redaction, idempotency and a tamper-evident audit log"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "mcp>=1.2"]

[project.scripts]
hsguard = "hsguard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
